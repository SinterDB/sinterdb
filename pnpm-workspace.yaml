packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "tools/*"

allowBuilds:
  esbuild: true
  unrs-resolver: true

catalog:
  "@types/node": "latest"
  "esbuild": "latest"
  "picocolors": "latest"
  "typescript": "latest"
  "vitest": "latest"

minimumReleaseAgeExclude:
  - prettier@3.9.7 || 3.9.8 || 3.9.10
  - "@types/node@26.6.2 || 26.6.4 || 26.6.5"
  - eslint@10.11.0 || 10.12.0
  - globals@17.13.0
  - "@vitest/coverage-v8@5.0.4 || 5.0.5"
  - "@vitest/mocker@5.0.4 || 5.0.5"
  - "@vitest/spy@5.0.4 || 5.0.5"
  - vitest@5.0.4 || 5.0.5
